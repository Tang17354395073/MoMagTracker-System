# 项目相关配置
ruoyi:
  # 名称
  name: MoMagTracker
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径
  profile: D:/MoMagTracker/uploadPath  # 建议改为项目相关路径
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    max-swallow-size: -1  # 不限制上传文件大小
    max-http-form-post-size: -1  # 不限制表单POST大小
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    tracker: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Dify配置
dify:
  api:
    url: http://8.141.94.106:21777  # Dify系统地址
    key: # 如果有API Key，填写在这里
  username: 15948660043@163.com    # Dify登录用户名
  password: tang2001 # Dify登录密码

# 视频处理配置
video:
  upload:
    max-size: 1024MB
    allowed-extensions: .mp4,.avi,.mov,.mkv,.flv

# Python脚本配置
python:
  executable: "E:/RuoYiProject/MoMagTracker-Compare/.venv/Scripts/python.exe"
  enabled: true
  # 算法脚本路径配置 - 现在可以灵活配置不同算法的脚本
  scripts:
    # 拉格朗日算法
    lagrangian: "E:/RuoYiProject/MoMagTracker-Compare/Lagrangian-based-Motion-Mag/Lagrangian-based-Motion-Magnification.py"
    # 欧拉算法
    eulerian: "E:/RuoYiProject/MoMagTracker-Compare/Eulerian-based-Motion-Mag/Eulerian-based-Motion-Magnification.py"
    # 深度学习算法
    deeplearning: "E:/RuoYiProject/MoMagTracker-Compare/Learning-based-Motion-Mag/Learning-based-Motion-Magnification.py"
    # 其他算法可以继续添加
    # example: "E:/RuoYiProject/MoMagTracker-Compare/Another-Algorithm/algorithm.py"

# Spring 配置
spring:
  # 邮件配置 - 新增网易邮箱配置
  mail:
    host: smtp.163.com  # 邮箱服务器
    port: 465           # SSL端口
    username: 15948660043@163.com  # 发件人邮箱
    password: LVxYK34uNZTgMfUM  # SMTP授权码
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false  # 不使用 TLS
          ssl:
            enable: true   # 使用 SSL 加密
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 1024MB
      # 设置总上传的文件大小
      max-request-size: 1024MB
      enabled: true
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: 127.0.0.1
    # 端口，默认为 6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: Tang15948660043
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# 应用配置 - 新增
app:
  name: MoMagTracker

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: tracker.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
